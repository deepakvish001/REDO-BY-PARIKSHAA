    <rect x="200" y="166" width="470" height="16" rx="8" fill="#26262e" />
    <rect x="200" y="166" width="400" height="16" rx="8" fill="#34d399"
          class="bar" style="animation-delay:0s" />
    <text x="686" y="178" class="value">17</text>
