<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Week in code">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    .title { fill: #f4f4f5; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { fill: #9a9aa5; font-size: 15px; }
    .big { fill: #f4f4f5; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
    .small { fill: #9a9aa5; font-size: 13px; }
    .label { fill: #6b6b76; font-size: 10px; letter-spacing: 0.14em; font-weight: 700; }
    .chip { fill: #f4f4f5; font-size: 13px; font-weight: 600; }
    .chipCount { fill: #6b6b76; font-size: 12px; font-weight: 700; }
    .fightTitle { fill: #f4f4f5; font-size: 19px; font-weight: 700; }
    .fightScore { fill: #f97316; font-size: 30px; font-weight: 800; }
    .foot { fill: #6b6b76; font-size: 12px; }
    .rise { animation: rise 620ms cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="560" rx="24" /></clipPath>
  </defs>
  <rect width="1000" height="560" rx="24" fill="#0b0b0f" stroke="#26262e" />
  <!-- Clipped to the card, or its square corners overhang the rounded ones. -->
  <rect x="0" y="0" width="1000" height="4" fill="#f97316" clip-path="url(#card)" />

  <circle cx="60" cy="62" r="18" fill="#f97316" opacity="0.16" />
  <text x="60" y="71" class="title" fill="#f97316" text-anchor="middle" font-size="24">↻</text>
  <text x="92" y="60" class="title">My week in code</text>
  <text x="92" y="84" class="sub">24 Aug – 31 Aug</text>

  
    <g class="rise" style="animation-delay:0s">
      <rect x="40" y="132" width="226" height="96" rx="16"
            fill="#141419" stroke="#26262e" />
      <text x="62" y="188" class="big">28</text>
      <text x="62" y="211" class="small">problems solved</text>
    </g>
    <g class="rise" style="animation-delay:0.07s">
      <rect x="278" y="132" width="226" height="96" rx="16"
            fill="#141419" stroke="#26262e" />
      <text x="300" y="188" class="big">4</text>
      <text x="300" y="211" class="small">revisions done</text>
    </g>
    <g class="rise" style="animation-delay:0.14s">
      <rect x="516" y="132" width="226" height="96" rx="16"
            fill="#141419" stroke="#26262e" />
      <text x="538" y="188" class="big">27</text>
      <text x="538" y="211" class="small">submissions</text>
    </g>
    <g class="rise" style="animation-delay:0.21000000000000002s">
      <rect x="754" y="132" width="226" height="96" rx="16"
            fill="#141419" stroke="#26262e" />
      <text x="776" y="188" class="big">5</text>
      <text x="776" y="211" class="small">day streak</text>
    </g>
  <text x="40" y="252" class="label">DIFFICULTY MIX</text>
  <rect x="40" y="262" width="442" height="14" rx="7" fill="#34d399" />
    <text x="40" y="296" class="small" fill="#34d399">12 easy</text><rect x="488" y="262" width="368" height="14" rx="7" fill="#fbbf24" />
    <text x="488" y="296" class="small" fill="#fbbf24">10 medium</text><rect x="862" y="262" width="110" height="14" rx="7" fill="#f87171" />
    <text x="862" y="296" class="small" fill="#f87171">3 hard</text>
  <text x="40" y="326" class="label">TOPICS</text>
    <g class="rise">
      <rect x="40" y="336" width="78.8" height="30" rx="15" fill="#141419" stroke="#26262e" />
      <text x="56" y="356" class="chip">math</text>
      <text x="100.8" y="356" class="chipCount" text-anchor="end">7</text>
    </g>
    <g class="rise">
      <rect x="126.8" y="336" width="95.19999999999999" height="30" rx="15" fill="#141419" stroke="#26262e" />
      <text x="142.8" y="356" class="chip">greedy</text>
      <text x="204" y="356" class="chipCount" text-anchor="end">4</text>
    </g>
    <g class="rise">
      <rect x="230" y="336" width="160.79999999999998" height="30" rx="15" fill="#141419" stroke="#26262e" />
      <text x="246" y="356" class="chip">implementation</text>
      <text x="372.79999999999995" y="356" class="chipCount" text-anchor="end">4</text>
    </g>
    <g class="rise">
      <rect x="398.79999999999995" y="336" width="87" height="30" rx="15" fill="#141419" stroke="#26262e" />
      <text x="414.79999999999995" y="356" class="chip">Array</text>
      <text x="467.79999999999995" y="356" class="chipCount" text-anchor="end">4</text>
    </g>
    <g class="rise">
      <rect x="493.79999999999995" y="336" width="152.6" height="30" rx="15" fill="#141419" stroke="#26262e" />
      <text x="509.79999999999995" y="356" class="chip">number theory</text>
      <text x="628.4" y="356" class="chipCount" text-anchor="end">3</text>
    </g>
  
    <g class="rise" style="animation-delay:.25s">
      <rect x="40" y="396" width="920" height="86" rx="16" fill="#141419" stroke="#26262e" />
      <text x="62" y="424" class="label">BIGGEST FIGHT</text>
      <text x="62" y="452" class="fightTitle">Carrot Chopdown (Hard Version)</text>
      <text x="62" y="472" class="small">5 submits</text>
      <text x="938" y="452" class="fightScore" text-anchor="end">47</text>
      <text x="938" y="470" class="small" text-anchor="end">out of 100</text>
    </g>

  <text x="40" y="516" class="foot">3h 26m at the keyboard · 14 runs · 3 hints · new: dp, math, number theory</text>
  <text x="960" y="516" class="foot" text-anchor="end">Redo · parikshaa.org</text>
</svg>
